services:
  tvp-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - KUBERNETES_API_URL=http://localhost:8001
      - ARGO_CD_URL=http://localhost:8080
      - ARGO_CD_USERNAME=admin
      - ARGO_CD_PASSWORD=password
      - GITOPS_REPO_URL=${GITOPS_REPO_URL:-https://github.com/lloydchang/tvp.git}
    volumes:
      - .:/app
      - ./.kube:/home/app/.kube
    command: bash -c "cd /app && sleep infinity"