name: Run Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.14'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f fastapi/requirements.txt ]; then pip install -r fastapi/requirements.txt; fi
        if [ -f fastapi/requirements-dev.txt ]; then pip install -r fastapi/requirements-dev.txt; fi
    
    - name: Run tests
      run: |
        ./fastapi/run_tests.sh
      
    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: fastapi/.pytest_cache
