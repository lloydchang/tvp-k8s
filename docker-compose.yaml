services:
  tvp-api:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - KUBERNETES_API_URL=http://k3s-api:8080
      - ARGO_CD_URL=http://argocd-server:8080
      - ARGO_CD_USERNAME=admin
      - ARGO_CD_PASSWORD=password
      - GITOPS_REPO_URL=${GITOPS_REPO_URL:-https://github.com/lloydchang/tvp.git}
    volumes:
      - .:/app
      - ./.kube:/home/app/.kube
    depends_on:
      - k3s

  k3s:
    image: rancher/k3s:latest
    command: server --disable-agent --no-deploy traefik
    privileged: true
    environment:
      - K3S_TOKEN=tvp-k3s-token
      - K3S_KUBECONFIG_OUTPUT=/output/kubeconfig.yaml
      - K3S_KUBECONFIG_MODE=666
    volumes:
      - k3s-server:/var/lib/rancher/k3s
      # This is just for demo, not secure for production
      - ./.kube:/output
    ports:
      - "6453:6443"  # Kubernetes API (changed from 6443 to avoid conflicts)
      - "30090:30080"  # ArgoCD UI (changed from 30080 to avoid conflicts)

  k3s-api:
    image: alpine/curl
    entrypoint: ["sh", "-c", "until curl -s http://k3s:8080; do sleep 1; done; sleep infinity"]
    depends_on:
      - k3s

volumes:
  k3s-server: {}